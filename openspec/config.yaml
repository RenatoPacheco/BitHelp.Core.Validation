schema: spec-driven

context: |
  .NET validation library, NuGet package BitHelp.Core.Validation.
  - src/ targets netstandard2.0; keep C# 7.3 compatible (no target-typed new()).
  - test/ is xUnit on net7.0 and references src/. test/Demo has no tests.
  - Validators come in pairs: src/Extends/*IsValidExt.cs (fluent extensions for
    ISelfValidation and ValidationNotification) and src/Notations/*IsValidAttribute.cs
    (DataAnnotations, based on BaseIsValidAttribute). Each needs tests in
    test/ExtendsTest/ and, where applicable, test/NotationsTest/.
  - Messages are localized in src/Resources/Resource.resx and Resource.pt-BR.resx.
    Resource.Designer.cs is hand-edited (not regenerated by build); update all three.
  - Commands: dotnet restore; dotnet build --no-restore; dotnet test --no-build.
    Build before test. CI uses .NET SDK 7.0.x.
  - Line endings: CRLF in working tree (.editorconfig); index stores LF.
  - Versioning is manual: bump <Version> in src/BitHelp.Core.Validation.csproj,
    add a RELEASES.md section, update README.md "Latest releases".
  - Publishing is manual via the "Build & Publish packages" workflow_dispatch.

